# Release 链接 iOS framework 时 DevirtualizationAnalysis 很吃内存；2g 会 OOM。
# Mac Mini 16G：给 Gradle / Kotlin daemon / K/N 编译器都抬到 6–8g。
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx6g
# Kotlin/Native 编译器跑在独立 JVM 上，不设的话仍可能用默认小堆。
kotlin.native.jvmArgs=-Xmx8g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# Layout V2 已是默认，kotlin.mpp.androidSourceSetLayoutVersion 已废弃，不要再设。
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 已升到 37，这条 suppress 针对旧的 36 告警，留着无意义。
# Gradle 9.5 + AGP 9.1 起可以直接跑在 JDK 25 上。
# Android Studio 升级后若把 Gradle JDK 重置回内置 JBR（通常是 25），无需再改。

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 当前联调租户（可被 local.properties 覆盖）。写进 gradle.properties 是为了
# IDE / Cursor Run 在 Sync 时也能拿到正确 applicationId，避免仍启动 .demo。
rider.tenant=bwcx
rider.mode=release
