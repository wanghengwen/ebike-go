<!DOCTYPE html>

<body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"

  <defs>

  <text x="172" y="618" text-anchor="middle" font-size="12" fill="#5f8a8a">shared + sharedUi</text>

  <line x1="266" y1="546" x2="266" y2="614" stroke="#2d6b6b" stroke-width="1.5"/>

  <text x="372" y="568" text-anchor="middle" font-size="30" font-weight="700" fill="#7ee0d0">58 / 26</text>

  <text x="572" y="596" text-anchor="middle" font-size="13" fill="#8fb5b5">共享层单测用例</text>
  <text x="572" y="618" text-anchor="middle" font-size="12" fill="#5f8a8a">状态机 / BLE 帧 / 签名</text>

  <line x1="666" y1="546" x2="666" y2="614" stroke="#2d6b6b" stroke-width="1.5"/>

  <text x="782" y="568" text-anchor="middle" font-size="30" font-weight="700" fill="#7ee0d0">227 × 2</text>
  <text x="782" y="596" text-anchor="middle" font-size="13" fill="#8fb5b5">中英文案键</text>
  <text x="782" y="618" text-anchor="middle" font-size="12" fill="#5f8a8a">原生与 H5 同一语言</text>

  <line x1="892" y1="546" x2="892" y2="614" stroke="#2d6b6b" stroke-width="1.5"/>
