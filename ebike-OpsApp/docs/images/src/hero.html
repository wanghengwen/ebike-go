<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .stage {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    border-radius: 28px;
    background: #fdfefe url('hero-bg.png') center/cover no-repeat;
    font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;
  }
  /* 中央柔光，把手机与街景分开 */
  .glow {
    position: absolute; left: 50%; top: 54%;
    width: 900px; height: 560px; transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(255,255,255,.92) 0%, rgba(255,255,255,.75) 45%, rgba(255,255,255,0) 72%);
  }
  .caption { position: absolute; left: 0; right: 0; top: 46px; text-align: center; }
  .caption .main { font-size: 34px; font-weight: 700; color: #17303a; letter-spacing: .5px; }
  .caption .main em { font-style: normal; color: #0f8080; }
  .caption .sub { margin-top: 12px; font-size: 17px; color: #61767f; }
  .caption .note { margin-top: 6px; font-size: 13px; color: #93a5ac; }
  .phones {
    position: absolute; left: 0; right: 0; top: 152px;
    display: flex; justify-content: center; align-items: flex-start; gap: 76px;
  }
  .item { display: flex; flex-direction: column; align-items: center; }
  .frame {
    padding: 7px;
    background: #ffffff;
    border-radius: 30px;
    box-shadow: 0 18px 40px rgba(20,50,60,.18), 0 2px 6px rgba(20,50,60,.10);
  }
  .frame img { display: block; width: 243px; height: 470px; object-fit: cover; border-radius: 24px; }
  .tag {
    margin-top: 16px; padding: 6px 20px; border-radius: 999px;
    background: rgba(15,128,128,.10); border: 1px solid rgba(15,128,128,.28);
    font-size: 16px; color: #0c6b6b; font-weight: 600;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="caption">
    <div class="main">4 万行代码，<em>96% 双端共用</em></div>
    <div class="sub">共享电单车运维 App · Kotlin Multiplatform + Compose Multiplatform</div>
    <div class="note">图为 Android 实机</div>
  </div>
  <div class="phones">
    <div class="item">
      <div class="frame"><img src="screen-map.png" alt="map" /></div>
      <div class="tag">地图找车</div>
    </div>
    <div class="item">
      <div class="frame"><img src="screen-workbench.png" alt="workbench" /></div>
      <div class="tag">运维工作台</div>
    </div>
  </div>
</div>
</body>
</html>
