server:
  port: 8080
  name: ebike-fence

nacos:
  serverAddr: 192.168.2.20
  port: 8848
  namespace: prod
  group: xyy
  # Go-specific overrides (optional). Java shared config lives in Nacos as ebike-fence.yml.
  dataId: ebike-fence.yml

# Redis / MySQL loaded from Nacos ({group}_ops). Leave empty for prod.
redis:
  addr: ""
  password: ""
  db: 6

mysql:
  maxOpenConns: 20
  maxIdleConns: 10

# Mirrors Java ApplicationProperties (prefix "xyy")
xyy:
  remoteLockDistance: 100
  helmetAuditWhite: []
  cancelAuthTenantIds:
    - "1007"
  proxy:
    # Java ebike-fence ClusterIP Service（Go 反向代理 / 影子比对目标）
    targetUrl: "http://ebike-fence.prod.svc.cluster.local:8080"
    # fence-21: shadow-verified; pod 65956fd6b6-vkwvd: helpConfig+selectAlarmContact 148/148 MATCH
