server:
  port: 8080
  name: ebike-fence

spring:
  application:
    name: ebike-fence
  xyy:
    fastid:
      enabled: true
      server-addr: fastid.luopingtech.com
      namespace: prod
      groupId: xyy
      drift-time: 10

nacos:
  serverAddr: 127.0.0.1
  port: 8848
  namespace: prod
  group: xyy
  # Go-specific overrides (optional). Java shared config lives in Nacos as ebike-fence.yml.
  dataId: ebike-fence.yaml

# Redis is loaded from Nacos redis.yaml (group: {nacos.group}_ops, key: redis.ebike_fence).
# Optional local override for dev when Nacos is unavailable:
redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 6

# MySQL DSN is loaded from Nacos mysql.yaml (group: {nacos.group}_ops, key: mysql.ebike_fence).
# Optional local override for dev when Nacos is unavailable:
mysql:
  maxOpenConns: 20
  maxIdleConns: 10

# Mirrors Java ApplicationProperties (prefix "xyy")
xyy:
  remoteLockDistance: 100
  helmetAuditWhite: []
  cancelAuthTenantIds:
    - "1007"
  proxy:
    targetUrl: "http://127.0.0.1:8081"
    # fence-21: 45 readonly endpoints shadow-verified (1608/1608 MATCH, 0 DIFF)
    liveList:
    # synced toward application-k8s.yml liveList (shadow-verified + prod cutover)
