name: OpsApp

on:
  push:
    branches: [main]
    paths:
      - 'ebike-OpsApp/**'
      - '.github/workflows/opsapp.yml'
  pull_request:
    paths:
      - 'ebike-OpsApp/**'
      - '.github/workflows/opsapp.yml'
  workflow_dispatch:

# 同一分支只保留最新一次运行，旧的直接取消。
concurrency:
  group: opsapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin (KMP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebike-OpsApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 与本地一致：Gradle 9.5 + AGP 9.1 直接跑在 JDK 25 上。
          java-version: '25'

      # shared / sharedUi 用的是 AGP 的 KMP 插件，即便只编译元数据也要 SDK 才能配置。
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # 仓库里从 Windows 提交，gradlew 通常没有可执行位。
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 这一步单独放最前面，因为它是唯一能发现「平台专有 API 漏进 commonMain」的检查。
      # assembleDebug 和单测走 Android/JVM 目标，@Volatile、System.currentTimeMillis()、
      # String.format 这类在那儿全是绿灯。
      # 实测：注入一处 System.currentTimeMillis() 后本步失败，而下面两步照样通过。
      - name: Verify commonMain is platform-neutral
        run: ./gradlew verifyCommonMain

      # 元数据编译不覆盖 iosMain 的 actual 实现，那些代码得真按 iOS target 编一遍才有人管。
      # 需要 macOS 的只有 linkFramework，klib 编译在 Linux 上就能跑。
      # 实测：iosMain 里一处 `x as NSString` 的必失败 cast，就是被本步拦下的。
      - name: Compile iOS targets
        run: ./gradlew :shared:compileKotlinIosArm64 :sharedUi:compileKotlinIosArm64

      - name: Unit tests
        run: ./gradlew :shared:testAndroidHostTest

      # 没有 local.properties，租户回落到 demo，读 config/demo_release.json
      # （仓库里唯一入库的租户配置，不含真实密钥）。
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: ebike-OpsApp/shared/build/reports/
          retention-days: 7

  webh5:
    name: webH5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebike-OpsApp/webH5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ebike-OpsApp/webH5/package-lock.json

      - run: npm ci

      # 单独一步只为让类型错误的失败位置一眼可辨；下面 npm run build 里的
      # vue-tsc 会命中这一步的增量缓存，不重复付出代价。
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 地图 key 留空：构建期不校验，运行期靠 hasMapKey() 优雅降级。
      - name: Build
        run: npm run build
